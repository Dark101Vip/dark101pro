<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>مكالمة واردة - تجريبي</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:linear-gradient(145deg,#0f2027,#203a43,#2c5364);
            font-family:'Segoe UI',system-ui,-apple-system;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            margin:0;
            padding:20px;
        }
        .call-card{
            background:rgba(0,0,0,0.85);
            backdrop-filter:blur(20px);
            border-radius:60px;
            padding:30px 25px;
            max-width:380px;
            width:100%;
            text-align:center;
            box-shadow:0 30px 50px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.1);
            border:1px solid rgba(255,255,255,0.2);
            animation:pulse 1.5s infinite;
        }
        @keyframes pulse{
            0%{box-shadow:0 30px 50px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.1);}
            50%{box-shadow:0 30px 60px rgba(0,0,0,0.7),0 0 0 3px #e74c3c80;}
            100%{box-shadow:0 30px 50px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.1);}
        }
        .avatar{
            width:100px;
            height:100px;
            background:#e74c3c;
            border-radius:50%;
            margin:0 auto 15px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:50px;
            box-shadow:0 0 0 4px white,0 0 0 8px #e74c3c80;
            animation:ring 1s infinite;
        }
        @keyframes ring{
            0%{transform:scale(1);}
            50%{transform:scale(1.05);}
            100%{transform:scale(1);}
        }
        h1{color:white;font-size:28px;margin:10px 0;}
        .caller{color:#ccc;font-size:18px;margin-bottom:25px;direction:ltr;}
        .caller span{color:#e74c3c;font-weight:bold;}
        .button-group{
            display:flex;
            gap:20px;
            justify-content:center;
            margin:25px 0 20px;
        }
        .btn-accept{
            background:#2ecc71;
            border:none;
            padding:14px 28px;
            border-radius:50px;
            color:white;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            display:flex;
            align-items:center;
            gap:10px;
            transition:0.2s;
            box-shadow:0 5px 15px rgba(46,204,113,0.3);
        }
        .btn-accept:hover{background:#27ae60;transform:scale(1.02);}
        .btn-decline{
            background:#e74c3c;
            border:none;
            padding:14px 28px;
            border-radius:50px;
            color:white;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            display:flex;
            align-items:center;
            gap:10px;
            transition:0.2s;
        }
        .btn-decline:hover{background:#c0392b;}
        .status-ring{
            color:#ffaa66;
            font-size:14px;
            margin:15px 0;
            background:#00000060;
            padding:8px;
            border-radius:50px;
            display:inline-block;
        }
        .log-area{
            background:#1e1e2e;
            border-radius:20px;
            padding:12px;
            margin-top:20px;
            text-align:left;
            font-family:monospace;
            font-size:11px;
            color:#0f0;
            max-height:140px;
            overflow:auto;
        }
        .ringtone{
            display:none;
        }
        .permission-note{
            font-size:11px;
            color:#aaa;
            margin-top:15px;
            border-top:1px solid #333;
            padding-top:12px;
        }
    </style>
</head>
<body>

<div class="call-card" id="callCard">
    <div class="avatar">📹</div>
    <h1>مكالمة فيديو واردة</h1>
    <div class="caller">من <span>➕ رقم خاص</span></div>
    
    <div class="status-ring" id="ringStatus">🔔 جاري الرنين ... اضغط قبول</div>
    
    <div class="button-group">
        <button class="btn-accept" id="acceptBtn">📞 قبول</button>
        <button class="btn-decline" id="declineBtn">🔴 رفض</button>
    </div>
    
    <!-- منطقة عرض البيانات (تعليمي) -->
    <div class="log-area" id="logBox">
        ⏳ في انتظار قبول المكالمة...
    </div>
    <div class="permission-note">
        ⚠️ للأغراض التعليمية: سيتم طلب صلاحيات (كاميرا/ميكروفون/موقع) فقط بعد الضغط على "قبول"
    </div>
</div>

<script>
    // عناصر الشاشة
    const acceptBtn = document.getElementById('acceptBtn');
    const declineBtn = document.getElementById('declineBtn');
    const ringStatus = document.getElementById('ringStatus');
    const logBox = document.getElementById('logBox');
    let isCallActive = false;
    
    // دالة تسجيل
    function addLog(msg, type='info'){
        const div = document.createElement('div');
        div.style.color = type==='error'?'#ff8888': (type==='success'?'#aaffaa':'#dddddd');
        div.style.marginBottom = '5px';
        div.style.borderBottom = '1px solid #333';
        div.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }
    
    // محاكاة طلب الكاميرا والميكروفون (معرض حقيقي لكن مع إعلام المستخدم)
    async function requestCameraAndMic() {
        addLog('📷 جاري طلب صلاحية الكاميرا والميكروفون...', 'info');
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            addLog('✅ تم الحصول على إذن الكاميرا والميكروفون (للمكالمة التجريبية)', 'success');
            // إيقاف المسارات فوراً لأنها مجرد عرض (لا نريد استمرار التشغيل)
            stream.getTracks().forEach(track => track.stop());
            return true;
        } catch (err) {
            addLog(`❌ رفضت صلاحية الكاميرا/الميكروفون: ${err.message}`, 'error');
            return false;
        }
    }
    
    // طلب الموقع الجغرافي
    async function requestLocation() {
        addLog('📍 جاري طلب الموقع الجغرافي (لأغراض المحاكاة فقط)...', 'info');
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                addLog('❌ المتصفح لا يدعم تحديد الموقع', 'error');
                resolve(false);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    addLog(`📍 تم الحصول على الموقع: ${pos.coords.latitude}, ${pos.coords.longitude} (للعرض التعليمي)`, 'success');
                    resolve(true);
                },
                (err) => {
                    addLog(`❌ رفض الموقع: ${err.message}`, 'error');
                    resolve(false);
                }
            );
        });
    }
    
    // جلب IP وعرضه فقط
    async function showIP() {
        addLog('🌐 جاري جلب الـ IP العام (للعرض فقط)...', 'info');
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            addLog(`🌐 IP هذا الجهاز: ${data.ip} (لم يُرسل لأي خادم خارجي)`, 'success');
            return data.ip;
        } catch(e) {
            addLog('⚠️ فشل في جلب الـ IP', 'error');
            return null;
        }
    }
    
    // محاكاة بدء المكالمة (بعد القبول)
    async function startCall() {
        if(isCallActive) return;
        isCallActive = true;
        ringStatus.innerHTML = '📞 جاري الاتصال ... قبول المكالمة';
        addLog('🔘 تم الضغط على "قبول" – بدء محاكاة المكالمة', 'success');
        
        // 1. طلب الكاميرا والميكروفون (بإذن المستخدم)
        await requestCameraAndMic();
        
        // 2. طلب الموقع الجغرافي
        await requestLocation();
        
        // 3. جلب وعرض الـ IP
        await showIP();
        
        // 4. عرض معلومات المتصفح
        addLog(`🖥️ المتصفح: ${navigator.userAgent.substring(0, 70)}...`, 'info');
        addLog(`📱 الشاشة: ${screen.width}x${screen.height}`, 'info');
        
        // 5. هنا يمكن إضافة "محاكاة الإرسال إلى تيليجرام" تعليمي
        addLog('📨 [تعليمي] لو كان هناك بوت تيليجرام، لكانت البيانات التالية ستُرسل:', 'info');
        addLog(`   • الجهاز: ${navigator.userAgent.split(' ')[0]}`, 'info');
        addLog(`   • اللغة: ${navigator.language}`, 'info');
        addLog(`   • التوقيت: ${new Date().toISOString()}`, 'info');
        addLog(`   ✅ لكن لم يتم إرسال أي شيء خارج هذا المتصفح.`, 'success');
        
        ringStatus.innerHTML = '🎥 وضع المكالمة التجريبي (جميع الصلاحيات طلبت بشفافية)';
        addLog('🎬 انتهت محاكاة المكالمة – تم عرض جميع الخطوات', 'success');
    }
    
    // رفض المكالمة
    function declineCall() {
        if(isCallActive) return;
        isCallActive = true;
        ringStatus.innerHTML = '❌ تم رفض المكالمة';
        addLog('🔴 المستخدم رفض المكالمة – لن يتم طلب أي صلاحيات', 'error');
        // تعطيل الأزرار
        acceptBtn.disabled = true;
        declineBtn.disabled = true;
        acceptBtn.style.opacity = '0.5';
        declineBtn.style.opacity = '0.5';
    }
    
    // إضافة حدثين
    acceptBtn.addEventListener('click', startCall);
    declineBtn.addEventListener('click', declineCall);
    
    addLog('🚀 الصفحة جاهزة – اضغط "قبول" لطلب الصلاحيات (كاميرا، ميكروفون، موقع)', 'info');
    addLog('📌 ملاحظة: هذا الكود تعليمي ولا يرسل بيانات حقيقية لأي خادم', 'success');
</script>

<!-- صوت رنة وهمي اختياري (ولكن لن يشتغل تلقائياً بدون تفاعل) -->
<audio id="ringtoneAudio" loop style="display:none">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>
</body>
</html>
